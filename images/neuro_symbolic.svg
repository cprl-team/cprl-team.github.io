<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="ns-t">
  <title id="ns-t">Neuro-symbolic AI — perception bridged into symbolic logic</title>
  <defs>
    <pattern id="bpg-ns" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle class="bp-grid" cx="1.5" cy="1.5" r="1" />
    </pattern>
  </defs>
  <rect x="0" y="0" width="320" height="200" fill="url(#bpg-ns)" />

  <!-- edges -->
  <g>
    <line class="bp-edge" x1="140" y1="72" x2="205" y2="100" />
    <line class="bp-edge" x1="140" y1="128" x2="205" y2="100" />
    <line class="bp-edge" x1="205" y1="100" x2="268" y2="100" />
    <polygon class="bp-arrow" points="244,95 256,100 244,105" />
  </g>

  <!-- glyph: brain (perception) bridging to logic symbols -->
  <g class="bp-glyph">
    <path d="M70 64 C44 64 38 92 50 102 C40 116 56 138 74 130 C80 140 96 138 96 124 C108 120 108 96 96 92 C100 76 86 62 74 70" />
    <line x1="74" y1="70" x2="74" y2="130" />
  </g>

  <!-- nodes -->
  <circle class="bp-ring" cx="268" cy="100" r="16" />
  <circle class="bp-node" cx="140" cy="72" r="7" />
  <circle class="bp-node" cx="140" cy="128" r="7" />
  <circle class="bp-node" cx="205" cy="100" r="7" />
  <circle class="bp-node--reasoning" cx="268" cy="100" r="10" />

  <!-- labels -->
  <text class="bp-label" x="40" y="56">[ percept ]</text>
  <text class="bp-label bp-label--sym" x="205" y="78" text-anchor="middle">&#8743;&#8594;</text>
  <text class="bp-label" x="268" y="134" text-anchor="middle">logic</text>
</svg>
