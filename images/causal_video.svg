<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="cv-t">
  <title id="cv-t">Causal video understanding — frames flowing into a reasoning node</title>
  <defs>
    <pattern id="bpg-cv" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle class="bp-grid" cx="1.5" cy="1.5" r="1" />
    </pattern>
  </defs>
  <rect x="0" y="0" width="320" height="200" fill="url(#bpg-cv)" />

  <!-- edges -->
  <g>
    <line class="bp-edge" x1="140" y1="72" x2="205" y2="100" />
    <line class="bp-edge" x1="140" y1="128" x2="205" y2="100" />
    <line class="bp-edge" x1="205" y1="100" x2="268" y2="100" />
    <polygon class="bp-arrow" points="244,95 256,100 244,105" />
  </g>

  <!-- glyph: film frame -->
  <g class="bp-glyph">
    <rect x="28" y="62" width="72" height="76" rx="5" />
    <line x1="28" y1="84" x2="100" y2="84" />
    <line x1="28" y1="116" x2="100" y2="116" />
    <line x1="42" y1="62" x2="42" y2="138" />
    <line x1="86" y1="62" x2="86" y2="138" />
    <polygon points="58,90 74,100 58,110" />
  </g>

  <!-- nodes -->
  <circle class="bp-ring" cx="268" cy="100" r="16" />
  <circle class="bp-node" cx="140" cy="72" r="7" />
  <circle class="bp-node" cx="140" cy="128" r="7" />
  <circle class="bp-node" cx="205" cy="100" r="7" />
  <circle class="bp-node--reasoning" cx="268" cy="100" r="10" />

  <!-- labels -->
  <text class="bp-label" x="28" y="54">[ video ]</text>
  <text class="bp-label" x="268" y="134" text-anchor="middle">why?</text>
</svg>
