<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="ch-t">
  <title id="ch-t">Causal AI in healthcare — biomarkers reasoned into a diagnosis</title>
  <defs>
    <pattern id="bpg-ch" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle class="bp-grid" cx="1.5" cy="1.5" r="1" />
    </pattern>
  </defs>
  <rect x="0" y="0" width="320" height="200" fill="url(#bpg-ch)" />

  <!-- edges -->
  <g>
    <line class="bp-edge" x1="140" y1="72" x2="205" y2="100" />
    <line class="bp-edge" x1="140" y1="128" x2="205" y2="100" />
    <line class="bp-edge" x1="205" y1="100" x2="268" y2="100" />
    <polygon class="bp-arrow" points="244,95 256,100 244,105" />
  </g>

  <!-- glyph: heart + ECG pulse -->
  <g class="bp-glyph">
    <path d="M64 128 C40 108 36 86 52 76 C62 70 70 76 64 86 C58 76 66 70 76 76 C92 86 88 108 64 128 Z" />
    <polyline points="24,100 44,100 52,84 60,116 68,100 104,100" />
  </g>

  <!-- nodes -->
  <circle class="bp-ring" cx="268" cy="100" r="16" />
  <circle class="bp-node" cx="140" cy="72" r="7" />
  <circle class="bp-node" cx="140" cy="128" r="7" />
  <circle class="bp-node" cx="205" cy="100" r="7" />
  <circle class="bp-node--reasoning" cx="268" cy="100" r="10" />

  <!-- labels -->
  <text class="bp-label" x="24" y="56">[ signal ]</text>
  <text class="bp-label" x="268" y="134" text-anchor="middle">dx</text>
</svg>
