<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="pc-t">
  <title id="pc-t">Physics-informed causal AI — measurements reasoned into a mechanism</title>
  <defs>
    <pattern id="bpg-pc" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle class="bp-grid" cx="1.5" cy="1.5" r="1" />
    </pattern>
  </defs>
  <rect x="0" y="0" width="320" height="200" fill="url(#bpg-pc)" />

  <!-- edges -->
  <g>
    <line class="bp-edge" x1="140" y1="72" x2="205" y2="100" />
    <line class="bp-edge" x1="140" y1="128" x2="205" y2="100" />
    <line class="bp-edge" x1="205" y1="100" x2="268" y2="100" />
    <polygon class="bp-arrow" points="244,95 256,100 244,105" />
  </g>

  <!-- glyph: axes + decaying sine (impedance curve) -->
  <g class="bp-glyph">
    <polyline points="30,62 30,140 108,140" />
    <path d="M30 100 C44 70 54 70 66 100 C76 124 86 124 96 104 C102 94 106 96 108 100" />
  </g>

  <!-- nodes -->
  <circle class="bp-ring" cx="268" cy="100" r="16" />
  <circle class="bp-node" cx="140" cy="72" r="7" />
  <circle class="bp-node" cx="140" cy="128" r="7" />
  <circle class="bp-node" cx="205" cy="100" r="7" />
  <circle class="bp-node--reasoning" cx="268" cy="100" r="10" />

  <!-- labels -->
  <text class="bp-label" x="30" y="54">[ data ]</text>
  <text class="bp-label" x="268" y="134" text-anchor="middle">law</text>
</svg>
