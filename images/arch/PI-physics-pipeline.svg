<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Physics-informed causal AI pipeline: battery data to PINN to discovered dynamics to causal digital twin">
  <defs>
    <pattern id="gpi" width="20" height="20" patternUnits="userSpaceOnUse"><circle class="a-grid" cx="2" cy="2" r="1.3"/></pattern>
    <marker id="arpi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="a-arrow" d="M0,0L10,5L0,10z"/></marker>
  </defs>
  <rect class="a-bg" width="960" height="540"/>
  <rect width="960" height="540" fill="url(#gpi)"/>

  <text class="a-kick" x="30" y="38">PHYSICS-INFORMED · BATTERY</text>
  <text class="a-ttl" x="30" y="68">Process to mechanism · predict, discover, intervene</text>

  <g>
    <rect class="a-box" x="30" y="100" width="150" height="92" rx="10"/>
    <text class="a-lab" x="105" y="130" text-anchor="middle">Battery data</text>
    <text class="a-sub" x="105" y="152" text-anchor="middle">cycling · EIS</text>
    <text class="a-mono" x="105" y="172" text-anchor="middle">Severson</text>

    <rect class="a-box" x="214" y="100" width="150" height="92" rx="10"/>
    <text class="a-lab" x="289" y="130" text-anchor="middle">Features</text>
    <text class="a-sub" x="289" y="152" text-anchor="middle">first-100-cycle</text>
    <text class="a-mono" x="289" y="172" text-anchor="middle">dQ/dV</text>

    <rect class="a-accent" x="398" y="100" width="150" height="92" rx="10"/>
    <text class="a-lab" x="473" y="130" text-anchor="middle">Physics model</text>
    <text class="a-sub" x="473" y="152" text-anchor="middle">PINN + prior</text>
    <text class="a-mono" x="473" y="172" text-anchor="middle">SOH · RUL</text>

    <rect class="a-box" x="582" y="100" width="150" height="92" rx="10"/>
    <text class="a-lab" x="657" y="130" text-anchor="middle">Discover law</text>
    <text class="a-sub" x="657" y="152" text-anchor="middle">SINDy · PySR</text>
    <text class="a-mono" x="657" y="172" text-anchor="middle">dx/dt = f(x)</text>

    <rect class="a-metric" x="766" y="100" width="164" height="92" rx="10"/>
    <text class="a-lab a-mt" x="848" y="136" text-anchor="middle">Causal twin</text>
    <text class="a-sub a-mt" x="848" y="158" text-anchor="middle">counterfactual</text>

    <line class="a-edge" x1="180" y1="146" x2="210" y2="146" marker-end="url(#arpi)"/>
    <line class="a-edge" x1="364" y1="146" x2="394" y2="146" marker-end="url(#arpi)"/>
    <line class="a-edge" x1="548" y1="146" x2="578" y2="146" marker-end="url(#arpi)"/>
    <line class="a-edge" x1="732" y1="146" x2="762" y2="146" marker-end="url(#arpi)"/>
  </g>

  <rect class="a-panel" x="30" y="216" width="900" height="298" rx="12"/>
  <text class="a-kick" x="50" y="246">SAMPLE DATA · ILLUSTRATIVE (LFP cell, capacity fade vs cycle)</text>

  <!-- capacity-fade curve -->
  <line class="a-line" x1="58" y1="286" x2="58" y2="384"/>
  <line class="a-line" x1="58" y1="384" x2="390" y2="384"/>
  <polyline class="a-edge" points="64,300 110,304 156,310 202,318 248,330 294,348 340,372 384,382"/>
  <circle class="a-node" cx="202" cy="318" r="6"/>
  <text class="a-mono" x="58" y="404">capacity vs cycle (80% knee)</text>

  <!-- RUL prediction gauge -->
  <text class="a-lab" x="58" y="436">predicted remaining useful life</text>
  <rect class="a-track" x="58" y="448" width="300" height="14"/>
  <rect class="a-barem" x="58" y="448" width="186" height="14"/>
  <text class="a-mono" x="368" y="459">~9% err</text>
  <text class="a-em" x="58" y="486">from first 100 cycles only</text>

  <!-- counterfactual panel -->
  <line class="a-line" x1="430" y1="280" x2="430" y2="496"/>
  <text class="a-lab" x="456" y="300">Counterfactual: lower C-rate</text>
  <text class="a-mono" x="456" y="334">observed</text>
  <rect class="a-barem" x="560" y="324" width="120" height="13"/>
  <text class="a-mono" x="456" y="364">do(C-rate↓)</text>
  <rect class="a-barem" x="560" y="354" width="210" height="13"/>
  <text class="a-sub" x="456" y="396">a structural causal model over</text>
  <text class="a-sub" x="456" y="414">operating variables answers "what if".</text>
  <text class="a-em" x="456" y="446">discovered dynamics + SCM</text>
</svg>
