<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Neuro-symbolic causal AI pipeline: natural-language question to LLM to structural causal model to solver to verified answer">
  <defs>
    <pattern id="gns" width="20" height="20" patternUnits="userSpaceOnUse"><circle class="a-grid" cx="2" cy="2" r="1.3"/></pattern>
    <marker id="arns" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="a-arrow" d="M0,0L10,5L0,10z"/></marker>
  </defs>
  <rect class="a-bg" width="960" height="540"/>
  <rect width="960" height="540" fill="url(#gns)"/>

  <text class="a-kick" x="30" y="38">NEURO-SYMBOLIC · CAUSAL LLM</text>
  <text class="a-ttl" x="30" y="68">Perception and logic · language to SCM to answer</text>

  <g>
    <rect class="a-box" x="30" y="100" width="150" height="92" rx="10"/>
    <text class="a-lab" x="105" y="130" text-anchor="middle">Causal question</text>
    <text class="a-sub" x="105" y="152" text-anchor="middle">natural language</text>
    <text class="a-mono" x="105" y="172" text-anchor="middle">"what if?"</text>

    <rect class="a-box" x="214" y="100" width="150" height="92" rx="10"/>
    <text class="a-lab" x="289" y="130" text-anchor="middle">LLM</text>
    <text class="a-sub" x="289" y="152" text-anchor="middle">autoformalize</text>
    <text class="a-mono" x="289" y="172" text-anchor="middle">perception</text>

    <rect class="a-accent" x="398" y="100" width="150" height="92" rx="10"/>
    <text class="a-lab" x="473" y="130" text-anchor="middle">SCM spec</text>
    <text class="a-sub" x="473" y="152" text-anchor="middle">graph + estimand</text>
    <text class="a-mono" x="473" y="172" text-anchor="middle">do(·)</text>

    <rect class="a-box" x="582" y="100" width="150" height="92" rx="10"/>
    <text class="a-lab" x="657" y="130" text-anchor="middle">Solver</text>
    <text class="a-sub" x="657" y="152" text-anchor="middle">DoWhy · logic</text>
    <text class="a-mono" x="657" y="172" text-anchor="middle">identify</text>

    <rect class="a-metric" x="766" y="100" width="164" height="92" rx="10"/>
    <text class="a-lab a-mt" x="848" y="136" text-anchor="middle">Verified answer</text>
    <text class="a-sub a-mt" x="848" y="158" text-anchor="middle">+ faithfulness</text>

    <line class="a-edge" x1="180" y1="146" x2="210" y2="146" marker-end="url(#arns)"/>
    <line class="a-edge" x1="364" y1="146" x2="394" y2="146" marker-end="url(#arns)"/>
    <line class="a-edge" x1="548" y1="146" x2="578" y2="146" marker-end="url(#arns)"/>
    <line class="a-edge" x1="732" y1="146" x2="762" y2="146" marker-end="url(#arns)"/>
  </g>

  <rect class="a-panel" x="30" y="216" width="900" height="298" rx="12"/>
  <text class="a-kick" x="50" y="246">SAMPLE · ILLUSTRATIVE (correlation to causation, identifiability)</text>

  <!-- small DAG: Z -> X -> Y, Z -> Y -->
  <text class="a-lab" x="58" y="288">recovered structure</text>
  <circle class="a-node" cx="96" cy="330" r="14"/>
  <text class="a-mono" x="96" y="334" text-anchor="middle">Z</text>
  <circle class="a-node" cx="220" cy="330" r="14"/>
  <text class="a-mono" x="220" y="334" text-anchor="middle">X</text>
  <circle class="a-accent" cx="344" cy="330" r="14"/>
  <text class="a-mono a-mt" x="344" y="334" text-anchor="middle">Y</text>
  <line class="a-edge" x1="112" y1="330" x2="204" y2="330" marker-end="url(#arns)"/>
  <line class="a-edge" x1="236" y1="330" x2="328" y2="330" marker-end="url(#arns)"/>
  <path class="a-edge" d="M104,318 Q220,272 336,318" fill="none" marker-end="url(#arns)"/>
  <text class="a-em" x="58" y="378">backdoor Z confounds X and Y</text>
  <text class="a-mono" x="58" y="410">estimand: P(Y | do(X))</text>
  <text class="a-sub" x="58" y="438">solver checks the query is</text>
  <text class="a-sub" x="58" y="456">identifiable before answering.</text>

  <!-- robustness panel -->
  <line class="a-line" x1="430" y1="280" x2="430" y2="496"/>
  <text class="a-lab" x="456" y="300">Robustness audit</text>
  <text class="a-mono" x="456" y="334">direct LLM</text>
  <rect class="a-barem" x="600" y="324" width="92" height="13"/>
  <text class="a-mono" x="456" y="364">renamed vars</text>
  <rect class="a-barem" x="600" y="354" width="46" height="13"/>
  <text class="a-mono" x="456" y="394">solver-in-loop</text>
  <rect class="a-barem" x="600" y="384" width="210" height="13"/>
  <text class="a-sub" x="456" y="426">does it reason, or recall</text>
  <text class="a-sub" x="456" y="444">memorized causal text?</text>
  <text class="a-em" x="456" y="476">consistency under perturbation</text>
</svg>
