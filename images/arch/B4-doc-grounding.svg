<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="B4 Document Visual-Grounding Method overview architecture">
  <defs>
    <pattern id="gb4" width="20" height="20" patternUnits="userSpaceOnUse"><circle class="a-grid" cx="2" cy="2" r="1.3"/></pattern>
    <marker id="arb4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="a-arrow" d="M0,0L10,5L0,10z"/></marker>
  </defs>
  <rect class="a-bg" width="960" height="540"/>
  <rect width="960" height="540" fill="url(#gb4)"/>

  <text class="a-kick" x="30" y="38">B4 · CAUSAL DOCUMENT INTELLIGENCE</text>
  <text class="a-ttl" x="30" y="68">Document Visual-Grounding Method · overview</text>

  <g>
    <rect class="a-box" x="30" y="100" width="150" height="92" rx="10"/>
    <text class="a-lab" x="105" y="136" text-anchor="middle">Document</text>
    <text class="a-sub" x="105" y="158" text-anchor="middle">image + question</text>

    <rect class="a-box" x="214" y="100" width="150" height="92" rx="10"/>
    <text class="a-lab" x="289" y="130" text-anchor="middle">Layout encoder</text>
    <text class="a-sub" x="289" y="152" text-anchor="middle">regions as graph</text>
    <text class="a-mono" x="289" y="172" text-anchor="middle">DocLLM / GraphDoc</text>

    <rect class="a-box" x="398" y="100" width="150" height="92" rx="10"/>
    <text class="a-lab" x="473" y="136" text-anchor="middle">LVLM</text>
    <text class="a-sub" x="473" y="158" text-anchor="middle">answer</text>

    <rect class="a-accent" x="582" y="100" width="150" height="92" rx="10"/>
    <text class="a-lab" x="657" y="130" text-anchor="middle">Grounding head</text>
    <text class="a-sub" x="657" y="152" text-anchor="middle">predicts region</text>
    <text class="a-mono" x="657" y="172" text-anchor="middle">+ region loss</text>

    <rect class="a-metric" x="766" y="100" width="164" height="92" rx="10"/>
    <text class="a-lab a-mt" x="848" y="136" text-anchor="middle">region IoU</text>
    <text class="a-sub a-mt" x="848" y="158" text-anchor="middle">↑ localize evidence</text>

    <line class="a-edge" x1="180" y1="146" x2="210" y2="146" marker-end="url(#arb4)"/>
    <line class="a-edge" x1="364" y1="146" x2="394" y2="146" marker-end="url(#arb4)"/>
    <line class="a-edge" x1="548" y1="146" x2="578" y2="146" marker-end="url(#arb4)"/>
    <line class="a-edge" x1="732" y1="146" x2="762" y2="146" marker-end="url(#arb4)"/>
  </g>

  <rect class="a-panel" x="30" y="216" width="900" height="298" rx="12"/>
  <text class="a-kick" x="50" y="246">SAMPLE DATA · ILLUSTRATIVE (MMDocBench-style financial report)</text>

  <rect class="a-doc" x="50" y="266" width="300" height="226" rx="6"/>
  <line class="a-line" x1="70" y1="292" x2="320" y2="292" stroke-width="3" stroke-linecap="round"/>
  <line class="a-line" x1="70" y1="308" x2="300" y2="308" stroke-width="3" stroke-linecap="round"/>
  <line class="a-line" x1="70" y1="324" x2="320" y2="324" stroke-width="3" stroke-linecap="round"/>
  <rect class="a-cell" x="70" y="350" width="260" height="110"/>
  <line class="a-line" x1="70" y1="378" x2="330" y2="378"/>
  <line class="a-line" x1="70" y1="406" x2="330" y2="406"/>
  <line class="a-line" x1="70" y1="434" x2="330" y2="434"/>
  <line class="a-line" x1="200" y1="350" x2="200" y2="460"/>
  <text class="a-mono" x="80" y="370">Quarter</text><text class="a-mono" x="210" y="370">Revenue</text>
  <rect class="a-gstroke" x="202" y="408" width="126" height="24"/>
  <text class="a-em" x="210" y="425" font-family="monospace">$4.2M</text>
  <text class="a-mono" x="80" y="425">Q3 2024</text>
  <text class="a-em" x="50" y="484">↑ supporting region (the box the model must locate)</text>

  <line class="a-line" x1="400" y1="266" x2="400" y2="496"/>
  <text class="a-lab" x="426" y="290">Q: What was Q3 2024 revenue?</text>
  <text class="a-sub" x="426" y="318">Answer: <tspan class="a-em">$4.2M</tspan> &#160; <tspan class="a-mt2">EM ✓</tspan></text>

  <text class="a-lab" x="426" y="356">The gap this targets</text>
  <text class="a-sub" x="426" y="382">LVLMs <tspan class="a-em">answer</tspan> well but can't <tspan class="a-em">ground</tspan>:</text>
  <text class="a-mono" x="426" y="412">answer EM</text>
  <rect class="a-track" x="540" y="402" width="300" height="14"/><rect class="a-barem" x="540" y="402" width="200" height="14"/><text class="a-mono" x="848" y="413">66%</text>
  <text class="a-mono" x="426" y="440">region IoU</text>
  <rect class="a-track" x="540" y="430" width="300" height="14"/><rect class="a-bariou" x="540" y="430" width="11" height="14"/><text class="a-mono" x="848" y="441">2.4%</text>
  <text class="a-em" x="426" y="478">contribution: lift IoU out of single digits</text>
  <text class="a-em" x="426" y="496">while keeping answer accuracy.</text>
</svg>
