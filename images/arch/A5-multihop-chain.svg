<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="A5 Multi-Hop Causal-Chain Reasoner overview architecture">
  <defs>
    <pattern id="g5" width="20" height="20" patternUnits="userSpaceOnUse"><circle class="a-grid" cx="2" cy="2" r="1.3"/></pattern>
    <marker id="ar5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="a-arrow" d="M0,0L10,5L0,10z"/></marker>
    <marker id="ar5c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="a-arrow-c" d="M0,0L10,5L0,10z"/></marker>
  </defs>
  <rect class="a-bg" width="960" height="540"/>
  <rect width="960" height="540" fill="url(#g5)"/>

  <text class="a-kick" x="30" y="38">A5 · CAUSAL VIDEO UNDERSTANDING</text>
  <text class="a-ttl" x="30" y="68">Multi-Hop Causal-Chain Reasoner — overview</text>

  <g>
    <rect class="a-box" x="30" y="100" width="180" height="90" rx="10"/>
    <text class="a-lab" x="120" y="136" text-anchor="middle">Video</text>
    <text class="a-sub" x="120" y="158" text-anchor="middle">short clip</text>

    <rect class="a-box" x="262" y="100" width="180" height="90" rx="10"/>
    <text class="a-lab" x="352" y="136" text-anchor="middle">Event detection</text>
    <text class="a-sub" x="352" y="158" text-anchor="middle">discrete events</text>

    <rect class="a-accent" x="494" y="100" width="180" height="90" rx="10"/>
    <text class="a-lab" x="584" y="130" text-anchor="middle">Causal graph</text>
    <text class="a-sub" x="584" y="152" text-anchor="middle">per-video DAG</text>
    <text class="a-mono" x="584" y="172" text-anchor="middle">+ chain supervision</text>

    <rect class="a-box" x="726" y="100" width="200" height="90" rx="10"/>
    <text class="a-lab" x="826" y="136" text-anchor="middle">Multi-hop answer</text>
    <text class="a-sub" x="826" y="158" text-anchor="middle">walks the chain</text>

    <line class="a-edge" x1="210" y1="145" x2="256" y2="145" marker-end="url(#ar5)"/>
    <line class="a-edge" x1="442" y1="145" x2="488" y2="145" marker-end="url(#ar5)"/>
    <line class="a-edge" x1="674" y1="145" x2="720" y2="145" marker-end="url(#ar5)"/>
  </g>

  <rect class="a-panel" x="30" y="216" width="900" height="298" rx="12"/>
  <text class="a-kick" x="50" y="246">SAMPLE DATA · ILLUSTRATIVE (CounterVQA-style long causal chain)</text>

  <g>
    <circle class="a-node" cx="110" cy="320" r="26"/><text class="a-nlab" x="110" y="324" text-anchor="middle">e1</text>
    <circle class="a-node" cx="290" cy="320" r="26"/><text class="a-nlab" x="290" y="324" text-anchor="middle">e2</text>
    <circle class="a-node" cx="470" cy="320" r="26"/><text class="a-nlab" x="470" y="324" text-anchor="middle">e3</text>
    <circle class="a-rnode" cx="650" cy="320" r="30"/><text class="a-nlab" x="650" y="324" text-anchor="middle">e4</text>
    <line class="a-cedge" x1="136" y1="320" x2="258" y2="320" marker-end="url(#ar5c)"/>
    <line class="a-cedge" x1="316" y1="320" x2="438" y2="320" marker-end="url(#ar5c)"/>
    <line class="a-cedge" x1="496" y1="320" x2="614" y2="320" marker-end="url(#ar5c)"/>
    <text class="a-mono" x="110" y="368" text-anchor="middle">turn on stove</text>
    <text class="a-mono" x="290" y="368" text-anchor="middle">pan heats</text>
    <text class="a-mono" x="470" y="368" text-anchor="middle">oil ignites</text>
    <text class="a-mono" x="650" y="368" text-anchor="middle">smoke appears</text>
  </g>

  <text class="a-lab" x="50" y="424">Q: <tspan class="a-em">Why</tspan> did smoke appear? &#160; (requires e1→e2→e3→e4, a 3-hop chain)</text>
  <text class="a-sub" x="50" y="450">single-hop "what just happened?" is easy; accuracy <tspan class="a-em">collapses</tspan> as the chain lengthens.</text>

  <line class="a-line" x1="700" y1="280" x2="700" y2="496"/>
  <text class="a-lab" x="724" y="300">Difficulty tiers</text>
  <text class="a-sub" x="724" y="326">• adjacent event (1 hop)</text>
  <text class="a-sub" x="724" y="346">• long chain (k hops)</text>
  <text class="a-sub" x="724" y="366">• non-existent event</text>
  <text class="a-mono" x="724" y="404">train: Causal-VidQA</text>
  <text class="a-mono" x="724" y="424">eval: CounterVQA /</text>
  <text class="a-mono" x="724" y="442">CausalVQA</text>
  <text class="a-mono" x="724" y="476">goal: hold accuracy</text>
  <text class="a-mono" x="724" y="494">as hops increase</text>
</svg>
