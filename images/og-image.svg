<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="og-t">
  <title id="og-t">Causal Perception and Reasoning — research group</title>
  <defs>
    <pattern id="og-dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#e2ded5" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#ffffff" />
  <rect width="1200" height="630" fill="url(#og-dots)" opacity="0.6" />

  <!-- causal DAG motif (right) -->
  <g fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round">
    <line x1="820" y1="200" x2="960" y2="315" />
    <line x1="820" y1="430" x2="960" y2="315" />
    <line x1="900" y1="120" x2="960" y2="315" />
    <line x1="960" y1="315" x2="1090" y2="315" />
  </g>
  <g fill="#c25a3c">
    <circle cx="820" cy="200" r="16" />
    <circle cx="820" cy="430" r="16" />
    <circle cx="900" cy="120" r="16" />
    <circle cx="960" cy="315" r="16" />
  </g>
  <circle cx="1090" cy="315" r="26" fill="none" stroke="#0f766e" stroke-width="3" opacity="0.5" />
  <circle cx="1090" cy="315" r="20" fill="#0f766e" />

  <!-- wordmark (left) -->
  <text x="100" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="800" fill="#241606">Causal</text>
  <text x="100" y="345" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="800" fill="#c25a3c">Perception</text>
  <text x="100" y="440" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="800" fill="#241606">&amp; Reasoning</text>

  <text x="104" y="510" font-family="monospace" font-size="30" letter-spacing="3" fill="#6e6451">CPR &#183; RESEARCH GROUP &#183; cpr.ai.vn</text>
</svg>
